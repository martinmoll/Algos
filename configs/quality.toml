# Data-quality bounds (D-033). A value outside them is reported, never dropped.
# One [<dataset>.range.<column>] table per checked column (D-043).
#
# da_price: SDAC harmonised clearing-price limits, reference +4000 / -500 EUR/MWh, ACER
# Decision 02/2026 Annex I Art. 3 (checked 2026-11-18). Art. 4 moves them automatically (+500
# to the maximum, -100 to the minimum) after repeated prices beyond 70% of a limit, announced
# 21 days ahead. A range failure therefore means bad data OR a moved limit: check which, then
# update here with a decision-log entry.

[da_price.range.price_eur_mwh]
min = -500.0
max = 4000.0
label = "prices"  # word used in failure details
reviewed = "2026-11-18, D-033"
